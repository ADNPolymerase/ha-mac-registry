lookup:
  fields:
    query:
      required: true
      example: "Cannot connect to host 192.0.2.207:80 ssl:default"
      selector:
        text:
          multiline: true
export:
  fields:
    path:
      required: false
      example: "mac_registry.md"
      selector:
        text:
    format:
      required: false
      selector:
        select:
          options:
            - csv
            - markdown
          translation_key: export_format
refresh:
link:
  fields:
    mac:
      required: true
      example: "00:00:5e:00:53:41"
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
    label:
      required: false
      example: "Office laptop"
      selector:
        text:
unlink:
  fields:
    mac:
      required: true
      example: "00:00:5e:00:53:41"
      selector:
        text:
