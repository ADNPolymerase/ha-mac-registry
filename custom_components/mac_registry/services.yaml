lookup:
  fields:
    query:
      required: true
      example: "Cannot connect to host 192.0.2.207:80 ssl:default"
      selector:
        text:
          multiline: true
export:
  fields:
    path:
      required: false
      example: "mac_registry.md"
      selector:
        text:
    format:
      required: false
      selector:
        select:
          options:
            - csv
            - markdown
          translation_key: export_format
refresh:
