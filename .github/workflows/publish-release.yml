name: Publish Release

# Manual-only: a push must never publish a release by itself. Trigger it from
# the Actions tab on main once the version in manifest.json and its section in
# CHANGELOG.md are ready.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Read integration version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("custom_components/mac_registry/manifest.json"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          capture = False
          notes = []
          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              if line.startswith("## "):
                  heading = line[3:].strip()
                  if capture:
                      break
                  capture = heading == version or heading.startswith(f"{version} -")
                  continue
              if capture:
                  notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              raise SystemExit(f"No section for {version} in CHANGELOG.md")
          Path("RELEASE_NOTES.md").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists: bump the version in manifest.json first." >&2
            exit 1
          fi
          gh release create "$TAG_NAME" --target "$GITHUB_SHA" --title "$TAG_NAME" --notes-file RELEASE_NOTES.md --latest
